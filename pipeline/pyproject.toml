[project]
name = "vs-pipeline"
version = "0.1.0"
description = "Virtual Staging Platform - offline processing pipeline (per-property idempotent DAG)"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pye57>=0.4",
  "opencv-python-headless>=4.10",
  "trimesh>=4.5",
]

[project.optional-dependencies]
# Requires system-level PDAL install; needed from Phase M4-6 (stage G1). See docs/DEVELOPMENT.md.
pointcloud = ["pdal>=3.4"]
dev = [
  "pytest>=8.0",
  "ruff>=0.8",
  "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vs_pipeline"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
