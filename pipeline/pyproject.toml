[project]
name = "vs-pipeline"
version = "0.1.0"
description = "Virtual Staging Platform - offline processing pipeline (per-property idempotent DAG)"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pye57>=0.4",
  "opencv-python-headless>=4.10",
  "trimesh>=4.5",
  "shapely>=2.0",
  "mapbox-earcut>=1.0",
]

[project.optional-dependencies]
# Stage G1 point-cloud preprocessing. Install: pip install -e .[pointcloud]
# E57 sources are chunked per sweep via pye57 (native E57 tiling); PDAL only
# becomes relevant for non-E57 inputs and can be added then.
pointcloud = ["open3d>=0.18"]
# Stage G6 semantic segmentation. Install: pip install -e .[segmentation]
# Dev-GPU note (4 GB GTX 1650-class): default model is Mask2Former Swin-T +
# fp16 (docs/OPEN_PROBLEMS.md #20). For CUDA on Windows install torch from
# the matching index URL FIRST, e.g.:
#   pip install torch --index-url https://download.pytorch.org/whl/cu121
# SAM (slice 2) will be added to this extra when boundary refinement lands.
segmentation = [
  "torch>=2.2",
  "torchvision>=0.17",
  "transformers>=4.44",
  "pillow>=10.0",
  "scipy>=1.11",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.8",
  "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vs_pipeline"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
