services:
  db:
    image: postgres:16
    container_name: vs-postgres
    environment:
      POSTGRES_USER: vs
      POSTGRES_PASSWORD: vs
      POSTGRES_DB: virtual_staging
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vs -d virtual_staging"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
